name: practical-mlops
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Setup python 3.5.10
        uses: actions/setup-python@v1
        with:
          python-version: 3.5.10

      - name: Install dependencies
        run: |
          make install

      - name: Lint
        run: |
          make lint
